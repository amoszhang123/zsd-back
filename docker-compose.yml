services:
  db:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: zsd-db
    restart: always
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - appnet

  web:
    build: .
    container_name: zsd-web
    restart: always
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    # 发票图片落在宿主机 ./uploads（= /opt/zsd-back/uploads）。
    # 用 bind mount 而不是命名卷：出问题时能直接 ls/tar，备份脚本也只要 tar 一个目录。
    # 容器每次 deploy 都会重建，不挂出来的话图会跟着镜像一起没。
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "8000:8000"
    networks:
      appnet:
      npm_net:
        ipv4_address: 172.18.0.10

volumes:
  mysql_data:

networks:
  appnet:
    driver: bridge
  npm_net:
    external: true
    name: nginx-proxy-manage_default
